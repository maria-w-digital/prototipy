<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Направление — детский клуб «Ясам»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="item">
<div class="wrap">
  <div class="item-top">
    <div id="item"></div>
    <div class="side">
      <div class="ph" style="min-height:260px"><span><i class="ti ti-photo"></i> Фото с&nbsp;занятия</span></div>
      <div class="quote" id="side-quote"></div>
      <div class="box" id="contacts">
        <h3>Записаться</h3>
        <form class="lead-form">
          <label>Ваше имя<input type="text" placeholder="Анна" required></label>
          <label>Телефон<input type="tel" placeholder="+7 900 000-00-00" required></label>
          <label>Направление<select id="f-dir"></select></label>
          <button class="btn main" type="submit"><i class="ti ti-send"></i>Записаться на&nbsp;пробное</button>
          <div class="form-ok">Спасибо! Это&nbsp;прототип&nbsp;— заявка никуда не&nbsp;ушла.</div>
        </form>
      </div>
    </div>
  </div>
</div>
<section style="padding-top:40px">
  <div class="wrap">
    <div class="sec-head"><div><div class="eyebrow">Для&nbsp;этого&nbsp;же возраста</div><h2>Что&nbsp;ещё&nbsp;подойдёт</h2></div><p><a href="catalog.html">Все&nbsp;направления</a></p></div>
    <div class="grid three" id="more"></div>
  </div>
</section>
<script src="js/typo.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
